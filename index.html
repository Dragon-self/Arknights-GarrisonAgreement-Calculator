<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRTS 盟约激活计算器（最终版）</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a222b; --panel2:#202b36; --line:#33414f;
    --text:#e6edf3; --muted:#8b9bab; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#d29922; --danger:#f85149; --radius:10px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    line-height:1.5;
  }
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;
  }
  .panel h2{font-size:15px;margin:0 0 12px;color:var(--accent2)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px; align-items: center;}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;
  }
  button:hover{border-color:var(--accent2)}
  input[type="text"]{
    flex:1;min-width:140px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;
  }
  
  /* 快捷操作按钮组 */
  .action-group {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
  }
  
  /* 修改为蓝色字体的按钮 */
  .action-btn {
    background: transparent; border: 1px solid var(--accent2); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; transition: all .1s;
    color: var(--accent2);
  }
  .action-btn:hover { color: #fff; background: var(--accent2); }

  /* 隐藏已Ban开关 */
  .toggle-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; cursor: pointer; user-select: none; color: var(--accent2);
  }
  .toggle-label input {
    accent-color: var(--accent2); width: 16px; height: 16px; cursor: pointer;
  }

  .grade-block{margin-bottom:14px}
  .grade-title{
    font-size:12px;color:var(--muted);letter-spacing:.05em;margin-bottom:6px;
    border-bottom:1px dashed var(--line);padding-bottom:4px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  
  .chip{
    position: relative;
    background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;font-size:13px;cursor:pointer;user-select:none;
    transition:all .12s ease;
  }
  .chip:hover{border-color:var(--accent2)}
  .chip.selected{background:#1f6feb33;border-color:var(--accent2);color:#fff; padding-right: 24px;}
  .chip.disabled{
    opacity:.35;cursor:not-allowed;border-style:dashed;text-decoration:line-through;
  }
  .chip.disabled:hover{border-color:var(--line)}
  .chip .g{color:var(--muted);font-size:11px;margin-left:4px}
  .chip.selected .g{color:#9ecbff}
  
  .chip-minus {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 16px;
    height: 16px;
    background: var(--danger);
    color: #fff;
    border-radius: 50%;
    font-size: 14px;
    line-height: 14px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
  }
  .chip-minus:hover {
    background: #ff6b6b;
  }
  
  .empty{color:var(--muted);font-size:13px;padding:12px 0}
  .summary{font-size:13px;color:var(--muted);margin-bottom:10px}
  .summary b{color:var(--text)}
  
  .ban-box{
    background:var(--panel2);border:1px dashed var(--line);border-radius:8px;
    padding:10px;margin-bottom:14px;
  }
  .ban-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .ban-title{font-size:13px;font-weight:600;color:var(--danger); margin: 0;}
  .btn-clear-ban {
    background: transparent; border: 1px solid var(--danger); border-radius: 4px;
    color: var(--danger); font-size: 12px; cursor: pointer; padding: 2px 8px; 
    transition: all .1s;
  }
  .btn-clear-ban:hover { color: #fff; background: var(--danger); }

  .ban-list{display:flex;flex-wrap:wrap;gap:6px}
  .ban-chip{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3px 8px;
    font-size:12px;
    cursor:pointer;
    user-select:none;
    transition:all .1s;
  }
  .ban-chip:hover{border-color:var(--danger)}
  .ban-chip.on{background:#f8514922;border-color:var(--danger);color:#ffb3ad}

  /* 筛选框与按钮 */
  .filter-box {
    background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px;
    padding: 10px; margin-bottom: 12px;
  }
  .filter-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .filter-title{font-size:12px;font-weight:600;color:var(--accent); margin: 0;}
  .btn-clear-filter {
    background: transparent; border: 1px solid var(--accent); border-radius: 4px;
    color: var(--accent); font-size: 12px; cursor: pointer; padding: 2px 8px; 
    transition: all .1s;
  }
  .btn-clear-filter:hover { color: #fff; background: var(--accent); }

  .filter-list{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-chip{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:3px 8px; font-size:12px; cursor:pointer; user-select:none; transition:all .1s;
  }
  .filter-chip:hover{border-color:var(--accent);}
  .filter-chip.on{background:#3fb95033; border-color:var(--accent); color:#fff;}

  .cov-list{display:flex;flex-direction:column;gap:4px}
  .cov-row{
    display:flex;align-items:center;gap:8px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;font-size:13px;cursor:default;
    transition:border-color .12s ease;
  }
  .cov-row.active{border-color:var(--accent);background:#3fb95014}
  .cov-icon{
    width:22px;height:22px;flex:0 0 22px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
  }
  .cov-row.active .cov-icon{color:var(--accent);border-color:var(--accent)}
  .cov-name{font-weight:600;white-space:nowrap}
  .cov-type{
    font-size:10px;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:0 4px;line-height:16px;white-space:nowrap;
  }
  .cov-spacer{flex:1}
  .cov-count{
    font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);
    white-space:nowrap;
  }
  .cov-count b{font-size:13px;color:var(--text)}
  .cov-row.active .cov-count b{color:var(--accent)}
  .bonus-tag{
    font-size:10px;color:var(--accent);border:1px solid var(--accent);
    border-radius:5px;padding:0 4px;line-height:16px;white-space:nowrap;
  }
  .equip-tag{
    font-size:10px;color:var(--accent2);border:1px solid var(--accent2);
    border-radius:5px;padding:0 4px;line-height:16px;white-space:nowrap;
  }
  .badge{font-size:10px;padding:1px 5px;border-radius:5px;border:1px solid;white-space:nowrap}
  .badge.on{color:var(--accent);border-color:var(--accent)}

  .equip-box{
    background:var(--panel2);border:1px dashed var(--line);border-radius:8px;
    padding:10px;margin-bottom:14px;
  }
  .equip-title{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--accent2)}
  .equip-list{display:flex;flex-direction:column;gap:6px}
  
  .equip-row{
    display:flex; flex-direction:column; gap:6px; font-size:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; position: relative;
  }
  
  .equip-header {
    display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap;
    padding-right: 20px;
  }
  .equip-op{flex:0 0 auto;font-weight:600;white-space:nowrap; color: var(--text); margin-top: 1px;}
  .equip-op .g{color:var(--muted);font-size:10px;margin-left:3px}
  .equip-op .sp{font-size:10px;color:var(--warn);margin-left:4px;border:1px solid var(--warn);padding:0 3px;border-radius:4px;}
  
  .equip-covs{flex:1; color:var(--accent2); font-size:12px; line-height: 1.4; word-break: break-all; margin-top: 1px;}

  .equip-remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 0;
    line-height: 1;
  }
  .equip-remove:hover {
    color: var(--danger);
    background: #f8514922;
  }

  .equip-controls {
    display: flex; align-items: center; gap: 8px;
  }
  .equip-selects{
    display:flex; flex-wrap:wrap; gap:6px; flex:1; min-width:0;
  }
  .equip-select{
    flex:1 1 calc(50% - 6px); min-width:80px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:12px;
  }
  .equip-selects.multi .equip-select {
    flex:1 1 calc(33.3% - 6px);
  }
  .equip-select:focus{outline:none;border-color:var(--accent2)}
  
  .equip-empty{font-size:12px;color:var(--muted);padding:4px 0}
</style>
</head>
<body>

<h1>PRTS 盟约激活计算器</h1>
<div class="sub">
  支持重复选择同名干员，但盟约人数统计时，同名干员只计算 1 次（不重复计数）。
</div>

<div class="layout">
  <div class="panel">
    <div class="ban-box">
      <div class="ban-header">
        <div class="ban-title">Ban盟约（可多选）</div>
        <button class="btn-clear-ban" id="clearBansBtn">清除</button>
      </div>
      <div class="ban-list" id="banList"></div>
    </div>

    <h2>选择干员</h2>
    <div class="filter-box">
      <div class="filter-header">
        <div class="filter-title">按盟约筛选（可多选）</div>
        <button class="btn-clear-filter" id="clearFilterBtn">清除</button>
      </div>
      <div class="filter-list" id="filterList"></div>
    </div>

    <!-- 快捷操作栏：左侧隐藏，右侧清除 -->
    <div class="action-group">
      <label class="toggle-label">
        <input type="checkbox" id="hideBanned"> 隐藏已 Ban 干员
      </label>
      <button class="action-btn" id="clearSelsBtn">清除已选干员</button>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索干员名或盟约…">
    </div>
    <div id="operatorList"></div>

    <h2>装备指定</h2>
    <div class="equip-box">
      <div class="equip-title">为已选干员选择装备（可重复添加）</div>
      <div class="equip-list" id="equipList"></div>
    </div>
  </div>

  <div class="panel">
    <h2>盟约统计</h2>
    <div class="summary" id="summary">尚未选择干员。</div>
    <div class="cov-list" id="covenantList"></div>
  </div>
</div>

<script>
const COVS = [
  {n:"炎",t:"核心",r:3,icon:"炎"},{n:"萨尔贡",t:"核心",r:3,icon:"萨"},{n:"维多利亚",t:"核心",r:3,icon:"维"},{n:"谢拉格",t:"核心",r:3,icon:"谢"},
  {n:"阿戈尔",t:"核心",r:3,icon:"阿"},{n:"叙拉古",t:"核心",r:3,icon:"叙"},{n:"卡西米尔",t:"核心",r:3,icon:"卡"},{n:"乌萨斯",t:"核心",r:3,icon:"乌"},
  {n:"伊比利亚",t:"核心",r:3,icon:"伊"},{n:"莱塔尼亚",t:"核心",r:3,icon:"莱"},
  {n:"精准",t:"附加",r:2,icon:"准"},{n:"迅捷",t:"附加",r:2,icon:"迅"},{n:"灵巧",t:"附加",r:2,icon:"巧"},{n:"坚守",t:"附加",r:2,icon:"守"},
  {n:"助力",t:"附加",r:2,icon:"助"},{n:"远见",t:"附加",r:2,icon:"远"},{n:"奇迹",t:"附加",r:2,icon:"奇"},{n:"投资人",t:"附加",r:3,icon:"投"},
  {n:"突袭",t:"附加",r:2,icon:"突"},{n:"不屈",t:"附加",r:2,icon:"屈"},{n:"调和",t:"附加",r:1,icon:"和"},{n:"协防干员",t:"附加",r:2,icon:"协"},
  {n:"独行",t:"附加",r:1,icon:"独"},{n:"绝技",t:"附加",r:2,icon:"绝"},{n:"聚合",t:"附加",r:2,icon:"聚"},{n:"奥术",t:"附加",r:2,icon:"奥"}
];

const CORES = new Set(COVS.filter(c=>c.t==="核心").map(c=>c.n));

const EQUIPS = ["（无）","变形同构体","炎国短刀","维式重锤系列","阿戈尔重刃","萨尔贡浓茶","伊比利亚有刺刀","莱塔尼亚小鼓","谢拉格不融冰","乌萨斯呼吸器","卡西米尔竞技旗","叙拉古正装","精准狙击镜","突袭手雷","坚守盾牌","不屈弹射器","迅捷作战粮","灵巧轮流手套","奥术法阵","聚合急救箱"];

  "伊比利亚有刺刀":"伊比利亚", "莱塔尼亚小鼓":"莱塔尼亚", "谢拉格不融冰":"谢拉格", "乌萨斯呼吸器":"乌萨斯",
  "卡西米尔竞技旗":"卡西米尔", "叙拉古正装":"叙拉古", "精准狙击镜":"精准", "突袭手雷":"突袭",
  "坚守盾牌":"坚守", "不屈弹射器":"不屈", "迅捷作战粮":"迅捷", "灵巧轮流手套":"灵巧",
  "奥术法阵":"奥术", "聚合急救箱":"聚合"

const OPS = [
  {n:"拜松",g:"Ⅰ",c:["炎"]},{n:"艾丝黛尔",g:"Ⅰ",c:["萨尔贡","独行"]},{n:"慕斯",g:"Ⅰ",c:["维多利亚"]},
  {n:"角峰",g:"Ⅰ",c:["谢拉格","坚守"]},{n:"幽灵鲨",g:"Ⅰ",c:["阿戈尔"]},{n:"拉普兰德",g:"Ⅰ",c:["叙拉古"]},
  {n:"野鬃",g:"Ⅰ",c:["卡西米尔","助力"]},{n:"折桠",g:"Ⅰ",c:["乌萨斯","不屈"]},{n:"烈夏",g:"Ⅰ",c:["乌萨斯"]},
  {n:"深靛",g:"Ⅰ",c:["伊比利亚"]},{n:"地灵",g:"Ⅰ",c:["莱塔尼亚","独行"]},{n:"灰喉",g:"Ⅰ",c:["精准"]},
  {n:"陨星",g:"Ⅰ",c:["迅捷"]},{n:"霜叶",g:"Ⅰ",c:["灵巧"]},{n:"摆渡人",g:"Ⅰ",c:["坚守","不屈"]},
  {n:"夏栎",g:"Ⅰ",c:["助力"]},{n:"杰克",g:"Ⅰ",c:["突袭"]},{n:"褐果",g:"Ⅰ",c:["聚合"]},{n:"卡达",g:"Ⅰ",c:["奥术"]},

  {n:"矩",g:"Ⅱ",c:["炎"]},{n:"泡泡",g:"Ⅱ",c:["萨尔贡","坚守"]},{n:"莎草",g:"Ⅱ",c:["萨尔贡","聚合"]},
  {n:"Miss.Christine",g:"Ⅱ",c:["维多利亚","奥术"]},{n:"哈洛德",g:"Ⅱ",c:["维多利亚","谢拉格"]},{n:"雪猎",g:"Ⅱ",c:["谢拉格","精准"]},
  {n:"安哲拉",g:"Ⅱ",c:["阿戈尔","助力"]},{n:"复奏",g:"Ⅱ",c:["叙拉古","莱塔尼亚","奇迹"]},{n:"奥斯塔",g:"Ⅱ",c:["叙拉古"]},
  {n:"砾",g:"Ⅱ",c:["卡西米尔","不屈"]},{n:"真理",g:"Ⅱ",c:["乌萨斯"]},{n:"蓝毒",g:"Ⅱ",c:["伊比利亚"]},

  {n:"铸铁",g:"Ⅱ",c:["突袭"]},{n:"宴",g:"Ⅱ",c:["不屈"]},

  {n:"风絮",g:"Ⅲ",c:["炎","聚合"]},{n:"乌有",g:"Ⅲ",c:["炎"]},{n:"卡涅利安",g:"Ⅲ",c:["萨尔贡","莱塔尼亚","迅捷"]},
  {n:"至简",g:"Ⅲ",c:["萨尔贡"]},{n:"水灯心",g:"Ⅲ",c:["维多利亚","灵巧","独行"]},{n:"凯瑟琳",g:"Ⅲ",c:["维多利亚","远见"]},

  {n:"深巡",g:"Ⅲ",c:["阿戈尔","坚守"]},{n:"斯卡蒂",g:"Ⅲ",c:["阿戈尔","突袭"]},{n:"忍冬",g:"Ⅲ",c:["叙拉古","迅捷"]},
  {n:"伺夜",g:"Ⅲ",c:["叙拉古","精准"]},{n:"瑕光",g:"Ⅲ",c:["卡西米尔","突袭"]},{n:"历阵锐枪芬",g:"Ⅲ",c:["卡西米尔","远见"]},
  {n:"乌啾",g:"Ⅲ",c:["乌萨斯","聚合"]},{n:"奥尔佳",g:"Ⅲ",c:["乌萨斯","灵巧"]},{n:"海沫",g:"Ⅲ",c:["伊比利亚","不屈"]},
  {n:"旅骨",g:"Ⅲ",c:["伊比利亚","精准"]},{n:"车尔尼",g:"Ⅲ",c:["莱塔尼亚","坚守"]},{n:"空弦",g:"Ⅲ",c:["精准","远见"]},
  {n:"青枳",g:"Ⅲ",c:["迅捷","坚守"]},{n:"罗比菈塔",g:"Ⅲ",c:["坚守","助力"]},{n:"吉星",g:"Ⅲ",c:["奇迹"]},
  {n:"伊桑",g:"Ⅲ",c:["突袭","奥术"]},{n:"风丸",g:"Ⅲ",c:["不屈"]},{n:"盟约·辅助干员",g:"Ⅲ",c:["调和"]},

  {n:"寒檀",g:"Ⅳ",c:["远见"]},{n:"山",g:"Ⅳ",c:["投资人"]},{n:"赫德雷",g:"Ⅳ",c:["突袭"]},
  {n:"夜莺",g:"Ⅳ",c:["协防干员","聚合"]},{n:"W",g:"Ⅳ",c:["迅捷"]},{n:"淬羽赫默",g:"Ⅳ",c:["助力"]},

  {n:"迷迭香",g:"Ⅴ",c:["精准","助力"]},{n:"隐德来希",g:"Ⅴ",c:["灵巧","不屈"]},{n:"塞雷娅",g:"Ⅴ",c:["坚守","协防干员"]},
  {n:"可露希尔",g:"Ⅴ",c:["投资人"]},{n:"Mon3tr",g:"Ⅴ",c:["协防干员"]},{n:"阿米娅",g:"Ⅴ",c:["奇迹"]},
  {n:"溯光星源",g:"Ⅴ",c:["奥术"]},{n:"暴躁铁皮",g:"Ⅴ",c:["协防干员"],special:"6格"},

  {n:"烛煌",g:"Ⅵ",c:["炎","维多利亚","迅捷"]},{n:"夕",g:"Ⅵ",c:["炎","奥术"]},{n:"真言",g:"Ⅵ",c:["萨尔贡"]},
  {n:"酒神",g:"Ⅵ",c:["维多利亚"]},{n:"锏",g:"Ⅵ",c:["谢拉格","卡西米尔","莱塔尼亚"]},{n:"浊心斯卡蒂",g:"Ⅵ",c:["阿戈尔","聚合"]},
  {n:"克莱门莎",g:"Ⅵ",c:["阿戈尔"]},{n:"荒芜拉普兰德",g:"Ⅵ",c:["叙拉古"]},{n:"耀骑士临光",g:"Ⅵ",c:["卡西米尔","突袭"]},
  {n:"塔露拉",g:"Ⅵ",c:["乌萨斯","协防干员","奥术"]},{n:"引星棘刺",g:"Ⅵ",c:["伊比利亚","迅捷"]},{n:"逻各斯",g:"Ⅵ",c:["远见","奥术"]},
  {n:"蕾缪安",g:"Ⅵ",c:["精准"]},{n:"妮芙",g:"Ⅵ",c:["迅捷","远见"]},{n:"帕拉斯",g:"Ⅵ",c:["灵巧","助力"]},
  {n:"机械师",g:"Ⅵ",c:["坚守","协防干员"]},{n:"缪尔赛思",g:"Ⅵ",c:["协防干员"]},{n:"遥",g:"Ⅵ",c:["奇迹","聚合"]},
  {n:"史尔特尔",g:"Ⅵ",c:["突袭","不屈"]},{n:"魔王",g:"Ⅵ",c:["调和"]}
];

let bans = new Set();
let sels = []; 
let filterCovs = new Set();
const GRADE_ORDER = ["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ"];

const OP_INDEX = {};
GRADE_ORDER.forEach(g => {
  OPS.forEach(op => {
    if(op.g === g) OP_INDEX[g + "|" + op.n] = op;
  });
});

function isBanned(op) {
  const cores = op.c.filter(x => CORES.has(x));
  if (cores.length > 0) return bans.has(cores[0]);
  return op.c.every(x => bans.has(x));
}

function getEquipCovs(inst) {
  const eqArr = inst.eqs || [];
  let hasMimic = false;
  let others = [];
  eqArr.forEach(eq => {
    if (eq === "（无）" || !eq) return;
    if (eq === "变形同构体") hasMimic = true;
    else if (EQ_MAP[eq]) others.push(EQ_MAP[eq]);
  });
  return hasMimic ? others : [];
}

function renderBan() {
  const el = document.getElementById("banList");
  el.innerHTML = "";
  COVS.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "ban-chip" + (bans.has(c.n) ? " on" : "");
    chip.textContent = c.n;
    chip.onclick = () => {
      if(bans.has(c.n)) bans.delete(c.n); else bans.add(c.n);
      sels = sels.filter(inst => !isBanned(inst.op));
      renderAll();
    };
    el.appendChild(chip);
  });
}

function renderFilterList() {
  const el = document.getElementById("filterList");
  el.innerHTML = "";
  COVS.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "filter-chip" + (filterCovs.has(c.n) ? " on" : "");
    chip.textContent = c.n;
    chip.onclick = () => {
      if (filterCovs.has(c.n)) filterCovs.delete(c.n);
      else filterCovs.add(c.n);
      renderFilterList();
      renderOps();
    };
    el.appendChild(chip);
  });
}

function renderOps() {
  const el = document.getElementById("operatorList");
  el.innerHTML = "";
  const kw = document.getElementById("search").value.trim().toLowerCase();
  const hideBanned = document.getElementById("hideBanned").checked;
  
  GRADE_ORDER.forEach(g => {
    const list = OPS.filter(op => {
      if(op.g !== g) return false;
      
      if(kw) {
        const matchName = op.n.toLowerCase().includes(kw);
        const matchCov = op.c.some(x => x.includes(kw));
        if(!matchName && !matchCov) return false;
      }
      
      if (filterCovs.size > 0) {
        for (let c of filterCovs) {
          if (!op.c.includes(c)) return false;
        }
      }

      if (hideBanned && isBanned(op)) return false;
      
      return true;
    });
    
    if(list.length === 0) return;
    
    const block = document.createElement("div");
    block.className = "grade-block";
    block.innerHTML = `<div class="grade-title">${g} 阶</div>`;
    const chips = document.createElement("div");
    chips.className = "chips";

    list.forEach(op => {
      const k = g + "|" + op.n;
      const disabled = isBanned(op);
      
      const count = sels.filter(inst => inst.op.n === op.n).length;
      const countText = count > 0 ? `<span style="color:#1f6feb;margin-left:4px;font-weight:bold;">×${count}</span>` : "";
      
      const chip = document.createElement("div");
      chip.className = "chip" + (count > 0 ? " selected" : "") + (disabled ? " disabled" : "");
      chip.innerHTML = `${op.n}<span class="g">${g}</span>${countText}`;
      
      chip.title = op.c.join(" / ");

      if(!disabled) {
        chip.onclick = () => {
          const newInst = {
            uid: Date.now().toString() + Math.random().toString(36).substr(2, 5),
            op: op,
            eqs: Array(op.special === "6格" ? 6 : 2).fill("（无）")
          };
          sels.push(newInst);
          renderAll();
        };
      }

      if (count > 0) {
        const minusBtn = document.createElement("div");
        minusBtn.className = "chip-minus";
        minusBtn.textContent = "-";
        minusBtn.onclick = (e) => {
          e.stopPropagation();
          for (let i = sels.length - 1; i >= 0; i--) {
            if (sels[i].op.n === op.n) {
              sels.splice(i, 1);
              break;
            }
          }
          renderAll();
        };
        chip.appendChild(minusBtn);
      }

      chips.appendChild(chip);
    });

    block.appendChild(chips);
    el.appendChild(block);
  });
  
  if(el.children.length === 0) el.innerHTML = '<div class="empty">没有匹配的干员。</div>';
}

function renderEquip() {
  const el = document.getElementById("equipList");
  el.innerHTML = "";
  if (sels.length === 0) { el.innerHTML = '<div class="equip-empty">请先选择干员，再为干员指定装备。</div>'; return; }

  sels.sort((a,b) => {
    const ga = GRADE_ORDER.indexOf(a.op.g);
    const gb = GRADE_ORDER.indexOf(b.op.g);
    if(ga !== gb) return ga - gb;
    return a.op.n.localeCompare(b.op.n, "zh");
  });

  sels.forEach(inst => {
    const op = inst.op;
    const max = op.special === "6格" ? 6 : 2;

    const row = document.createElement("div");
    row.className = "equip-row";

    const header = document.createElement("div");
    header.className = "equip-header";

    const name = document.createElement("div");
    name.className = "equip-op";
    name.innerHTML = `${op.n}<span class="g">${op.g}</span>` + (op.special ? `<span class="sp">6格</span>` : "");
    header.appendChild(name);

    const extraCovs = getEquipCovs(inst);
    const allCovs = Array.from(new Set([...op.c, ...extraCovs]));
    const covsEl = document.createElement("div");
    covsEl.className = "equip-covs";
    covsEl.textContent = allCovs.join(" / ");
    header.appendChild(covsEl);

    row.appendChild(header);

    const clr = document.createElement("button");
    clr.className = "equip-remove";
    clr.innerHTML = "×";
    clr.onclick = () => {
      sels = sels.filter(x => x.uid !== inst.uid);
      renderAll();
    };
    row.appendChild(clr);

    const controls = document.createElement("div");
    controls.className = "equip-controls";

    const selectsDiv = document.createElement("div");
    selectsDiv.className = "equip-selects" + (op.special ? " multi" : "");
    
    for(let i=0; i<max; i++) {
      const sel = document.createElement("select");
      sel.className = "equip-select";
      EQUIPS.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e; opt.textContent = e;
        if(inst.eqs[i] === e) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = () => { inst.eqs[i] = sel.value; renderAll(); };
      selectsDiv.appendChild(sel);
    }
    controls.appendChild(selectsDiv);

    row.appendChild(controls);
    el.appendChild(row);
  });
}

function renderResult() {
  const el = document.getElementById("covenantList");
  const summary = document.getElementById("summary");
  el.innerHTML = "";
  
  let covMembers = new Map();
  COVS.forEach(c => covMembers.set(c.n, new Set()));

  let bases = {};
  COVS.forEach(c => { bases[c.n] = new Set(); });

  sels.forEach(inst => {
    const op = inst.op;
    op.c.forEach(c => {
      covMembers.get(c).add(op.n);
      bases[c].add(op.n);
    });
    getEquipCovs(inst).forEach(c => {
      covMembers.get(c).add(op.n);
    });
  });

  const hasHarmony = bases["调和"].size >= 1;

  let activeCnt = 0;
  let rows = [];

  COVS.forEach(c => {
    let n = covMembers.get(c.n).size;
    
    if (hasHarmony && CORES.has(c.n)) {
      n += 1;
    }

    if (n === 0) return; 

    const isActive = n >= c.r;
    if (isActive) activeCnt++;
    rows.push({ c, n, isActive });
  });

  rows.sort((a, b) => {
    if (a.isActive !== b.isActive) return a.isActive ? -1 : 1;
    return 0; 
  });

  const totalInsts = sels.length;

  if (totalInsts === 0) {
    summary.innerHTML = `尚未选择干员。${bans.size ? ` 已 Ban ${bans.size} 个盟约。` : ""}`;
  } else if (rows.length === 0) {
    summary.innerHTML = `已选择 <b>${totalInsts}</b> 名干员，但未提供任何盟约；已激活盟约 <b>0</b> 个。`;
  } else {
    summary.innerHTML = `已选择 <b>${totalInsts}</b> 名干员；当前已激活盟约 <b>${activeCnt}</b> 个。`
      + (hasHarmony ? ` 调和已激活，核心盟约人数 <b>+1</b>。` : "")
      + (bans.size ? ` 已 Ban <b>${bans.size}</b> 个盟约。` : "");
  }

  rows.forEach(({ c, n, isActive }) => {
    const div = document.createElement("div");
    div.className = "cov-row" + (isActive ? " active" : "");

    const bonusTag = (CORES.has(c.n) && hasHarmony) ? `<span class="bonus-tag">+1调和</span>` : "";
    
    div.innerHTML = `
      <div class="cov-icon">${c.icon}</div>
      <span class="cov-name">${c.n}</span>
      <span class="cov-type">${c.t}</span>
      <span class="cov-spacer"></span>
      ${bonusTag}
      <span class="cov-count"><b>${n}</b> / ${c.r}</span>
      ${isActive ? '<span class="badge on">已激活</span>' : ''}
    `;
    el.appendChild(div);
  });
}

function renderAll() {
  renderBan(); renderFilterList(); renderOps(); renderEquip(); renderResult();
}

/* 按钮事件绑定 */
document.getElementById("clearSelsBtn").onclick = () => { sels = []; renderAll(); };
document.getElementById("clearFilterBtn").onclick = () => { filterCovs.clear(); renderAll(); };
document.getElementById("clearBansBtn").onclick = () => { bans.clear(); renderAll(); };

document.getElementById("search").oninput = renderOps;
document.getElementById("hideBanned").onchange = renderOps;

renderAll();
</script>
