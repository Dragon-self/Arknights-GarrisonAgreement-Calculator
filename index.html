<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PRTS 盟约激活计算器</title>
<style>
  :root{
    --bg:#0f1419; --panel:#1a222b; --panel2:#202b36; --line:#33414f;
    --text:#e6edf3; --muted:#8b9bab; --accent:#3fb950; --accent2:#58a6ff;
    --warn:#d29922; --danger:#f85149; --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; padding:16px; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5; font-size:14px;
  }
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  .layout{display:flex;flex-direction:column;gap:16px;}
  
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;
  }
  .panel h2{font-size:14px;margin:0 0 10px;color:var(--accent2)}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;
  }
  button:active{background:var(--line)}
  input[type="text"]{
    flex:1;min-width:120px;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;
  }
  
  .grade-block{margin-bottom:12px}
  .grade-title{
    font-size:12px;color:var(--muted);letter-spacing:.05em;margin-bottom:6px;
    border-bottom:1px dashed var(--line);padding-bottom:4px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:13px;cursor:pointer;user-select:none;
  }
  .chip:active{border-color:var(--accent2)}
  .chip.selected{background:#1f6feb33;border-color:var(--accent2);color:#fff}
  .chip.disabled{
    opacity:.35;cursor:not-allowed;border-style:dashed;text-decoration:line-through;
  }
  .chip.disabled:active{border-color:var(--line)}
  .chip .g{color:var(--muted);font-size:11px;margin-left:4px}
  .chip.selected .g{color:#9ecbff}
  .empty{color:var(--muted);font-size:13px;padding:12px 0}
  .summary{font-size:13px;color:var(--muted);margin-bottom:8px}
  .summary b{color:var(--text)}
  
  .ban-box{
    background:var(--panel2);border:1px dashed var(--line);border-radius:8px;
    padding:8px;margin-bottom:12px;
  }
  .ban-title{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--danger)}
  .ban-list{display:flex;flex-wrap:wrap;gap:6px}
  .ban-chip{
    display:flex;align-items:center;gap:4px;background:var(--panel);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;
    font-size:12px;cursor:pointer;user-select:none;
  }
  .ban-chip.on{background:#f8514922;border-color:var(--danger);color:#ffb3ad}
  .ban-chip input{accent-color:var(--danger);margin:0;transform:scale(0.9)}

  .filter-box {
    background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px;
    padding: 8px; margin-bottom: 10px;
  }
  .filter-title{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--accent)}
  .filter-list{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-chip{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:4px 10px; font-size:12px; cursor:pointer; user-select:none;
  }
  .filter-chip.on{background:#3fb95033; border-color:var(--accent); color:#fff;}

  .cov-list{display:flex;flex-direction:column;gap:6px}
  .cov-row{
    display:flex;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:13px;cursor:pointer;
  }
  .cov-row.active{border-color:var(--accent);background:#3fb95014}
  .cov-row.partial{border-color:var(--warn);background:#d2992214}
  .cov-row.banned{border-color:var(--danger);background:#f8514914;opacity:.7}
  .cov-icon{
    width:20px;height:20px;flex:0 0 20px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
  }
  .cov-row.active .cov-icon{color:var(--accent);border-color:var(--accent)}
  .cov-row.partial .cov-icon{color:var(--warn);border-color:var(--warn)}
  .cov-row.banned .cov-icon{color:var(--danger);border-color:var(--danger)}
  .cov-name{font-weight:600;white-space:nowrap}
  .cov-spacer{flex:1}
  .cov-count{
    font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);
    white-space:nowrap;
  }
  .cov-count b{font-size:13px;color:var(--text)}
  .cov-row.active .cov-count b{color:var(--accent)}
  .cov-row.partial .cov-count b{color:var(--warn)}
  .bonus-tag{
    font-size:10px;color:var(--accent);border:1px solid var(--accent);
    border-radius:4px;padding:0 4px;line-height:14px;white-space:nowrap;
  }
  .equip-tag{
    font-size:10px;color:var(--accent2);border:1px solid var(--accent2);
    border-radius:4px;padding:0 4px;line-height:14px;white-space:nowrap;
  }
  .badge{font-size:10px;padding:1px 4px;border-radius:4px;border:1px solid;white-space:nowrap}
  .badge.on{color:var(--accent);border-color:var(--accent)}
  .badge.off{color:var(--muted);border-color:var(--line)}
  .badge.ban{color:var(--danger);border-color:var(--danger)}
  .cov-members{
    display:none;font-size:11px;color:var(--muted);
    padding:2px 0 4px 26px;line-height:1.6;
  }
  .cov-row.expanded + .cov-members{display:block}
  .cov-members .hit{color:#9ecbff}
  .cov-members .eq{color:var(--accent2)}

  .equip-box{
    background:var(--panel2);border:1px dashed var(--line);border-radius:8px;
    padding:8px;margin-bottom:12px;
  }
  .equip-title{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--accent2)}
  .equip-list{display:flex;flex-direction:column;gap:8px}
  .equip-row{
    display:flex;flex-direction:column;gap:6px;font-size:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:8px;
  }
  .equip-header{display:flex;justify-content:space-between;align-items:center;}
  .equip-op{font-weight:600;white-space:nowrap;}
  .equip-op .g{color:var(--muted);font-size:10px;margin-left:2px}
  .equip-op .sp{font-size:10px;color:var(--warn);margin-left:4px;border:1px solid var(--warn);padding:0 3px;border-radius:4px;}
  
  .equip-selects{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .equip-select{
    flex:1 1 calc(50% - 6px); min-width:100px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:4px; padding:4px; font-size:12px;
  }
  .equip-selects.multi .equip-select {
    flex:1 1 calc(33.3% - 6px);
  }
  
  .equip-clear{
    font-size:11px;padding:2px 8px;border-radius:4px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    cursor:pointer;
  }
  .equip-empty{font-size:12px;color:var(--muted);padding:4px 0}
</style>
</head>
<body>

<h1>PRTS 盟约激活计算器</h1>
<div class="sub">
  核心盟约被 Ban 时，第一核心盟约为该盟约的干员不可选。无核心盟约的干员需所有所属盟约都被 Ban 才不可选。调和激活时核心盟约人数 +1。暴躁铁皮可穿 6 件装备。
</div>

<div class="layout">
  <div class="panel">
    <h2>Ban 盟约</h2>
    <div class="ban-box">
      <div class="ban-title">勾选要 Ban 的盟约</div>
      <div class="ban-list" id="banList"></div>
    </div>

    <h2>选择干员</h2>
    <div class="filter-box">
      <div class="filter-title">按盟约筛选（可多选）</div>
      <div class="filter-list" id="filterList"></div>
    </div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="搜索干员名…">
      <button id="clearBtn">清空选择</button>
      <button id="selectAllBtn">全选可选</button>
    </div>
    <div id="operatorList"></div>

    <h2>装备指定</h2>
    <div class="equip-box">
      <div class="equip-title">为已选干员选择装备</div>
      <div class="equip-list" id="equipList"></div>
    </div>
  </div>

  <div class="panel">
    <h2>盟约统计</h2>
    <div class="summary" id="summary">尚未选择干员。</div>
    <div class="cov-list" id="covenantList"></div>
  </div>
</div>

const SPECIAL_MEMBERS = {"调和": ["巫役（分支占位）"], "协防干员": ["不屈者（分支占位）"]};

const selected = new Set();
const banned = new Set();
const expanded = new Set();
const equipments = {};
const filterCovs = new Set();
const GRADE_ORDER = ["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ","Ⅵ"];

const OP_INDEX = {};
GRADE_ORDER.forEach(g => {
  OPERATORS[g].forEach(op => { OP_INDEX[g + "|" + op.name] = {grade:g, ...op}; });
});

function keyOf(grade, name){ return grade + "|" + name; }

function getCoreCovenants(op){ return op.cov.filter(c => CORE_NAMES.has(c)); }
function getFirstCoreCovenant(op){
  const cores = getCoreCovenants(op);
  return cores.length > 0 ? cores[0] : null;
}
function isOperatorDisabled(op){
  const firstCore = getFirstCoreCovenant(op);
  if(firstCore){ return banned.has(firstCore); }
  else { return op.cov.length > 0 && op.cov.every(c => banned.has(c)); }
}
function disabledReason(op){
  const firstCore = getFirstCoreCovenant(op);
  if(firstCore && banned.has(firstCore)) return `第一核心盟约【${firstCore}】已被 Ban，无法选择`;
  if(!firstCore && op.cov.length > 0 && op.cov.every(c => banned.has(c))) return `所属盟约【${op.cov.join("、")}】均已被 Ban，无法选择`;
  return "";
}

function getEquipmentCov(key){
  const eqs = equipments[key] || [];
  const covs = new Set();
  let mimicCount = 0;
  const others = [];
  eqs.forEach(name => {
    if(name === "（无）" || !name) return;
    const e = EQUIP_INDEX[name];
    if(e) {
      if(e.isMimic) mimicCount++;
      else others.push(e);
    }
  });
  if(mimicCount > 0 && others.length > 0){
    others.forEach(o => o.cov.forEach(c => covs.add(c)));
  }
  return [...covs];
}

function renderBanList(){
  const box = document.getElementById("banList");
  box.innerHTML = "";
  COVENANTS.forEach(c => {
    const label = document.createElement("label");
    label.className = "ban-chip" + (banned.has(c.name) ? " on" : "");
    label.innerHTML = `<input type="checkbox" ${banned.has(c.name) ? "checked" : ""}><span>${c.name}</span>`;
    const cb = label.querySelector("input");
    cb.addEventListener("change", () => {
      if(cb.checked) banned.add(c.name);
      else banned.delete(c.name);
      [...selected].forEach(k => {
        const op = OP_INDEX[k];
        if(op && isOperatorDisabled(op)) {
          selected.delete(k);
          delete equipments[k];
        }
      });
      renderBanList(); renderOperators(); renderEquipList(); renderCovenants();
    });
    box.appendChild(label);
  });
}

function renderFilterList() {
  const box = document.getElementById("filterList");
  box.innerHTML = "";
  COVENANTS.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "filter-chip" + (filterCovs.has(c.name) ? " on" : "");
    chip.textContent = c.name;
    chip.addEventListener("click", () => {
      if (filterCovs.has(c.name)) filterCovs.delete(c.name);
      else filterCovs.add(c.name);
      renderFilterList(); renderOperators();
    });
    box.appendChild(chip);
  });
}

function renderOperators(){
  const box = document.getElementById("operatorList");
  box.innerHTML = "";
  const f = document.getElementById("search").value.trim().toLowerCase();

  GRADE_ORDER.forEach(grade => {
    const list = OPERATORS[grade].filter(op => {
      if(f) {
        const matchName = op.name.toLowerCase().includes(f);
        const matchCov = op.cov.some(c => c.toLowerCase().includes(f));
        if(!matchName && !matchCov) return false;
      }
      if (filterCovs.size > 0) {
        for (let cov of filterCovs) {
          if (!op.cov.includes(cov)) return false;
        }
      }
      return true;
    });

    if(list.length === 0) return;

    const block = document.createElement("div");
    block.className = "grade-block";
    block.innerHTML = `<div class="grade-title">${grade} 阶</div>`;
    const chips = document.createElement("div");
    chips.className = "chips";

    list.forEach(op => {
      const k = keyOf(grade, op.name);
      const disabled = isOperatorDisabled(op);
      const chip = document.createElement("div");
      chip.className = "chip" + (selected.has(k) ? " selected" : "") + (disabled ? " disabled" : "");
      chip.innerHTML = `${op.name}<span class="g">${grade}</span>`;
      
      if(!disabled){
        chip.addEventListener("click", () => {
          if(selected.has(k)) { selected.delete(k); delete equipments[k]; }
          else { selected.add(k); }
          chip.classList.toggle("selected");
          renderEquipList(); renderCovenants();
        });
      }
      chips.appendChild(chip);
    });

    block.appendChild(chips);
    box.appendChild(block);
  });

  if(box.children.length === 0) box.innerHTML = '<div class="empty">没有匹配的干员。</div>';
}
