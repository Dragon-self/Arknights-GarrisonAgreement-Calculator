<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>PRTS 盟约计算器</title>
<style>
  body { background: #0f1419; color: #e6edf3; font-family: sans-serif; padding: 10px; font-size: 14px; }
  .box { background: #1a222b; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #33414f; }
  h3 { margin: 0 0 10px 0; font-size: 14px; color: #58a6ff; }
  .tag { display: inline-block; padding: 4px 8px; margin: 4px; border: 1px solid #33414f; border-radius: 4px; cursor: pointer; background: #202b36; }
  .tag.on { background: #1f6feb; border-color: #58a6ff; }
  .tag.off { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
  .op-row { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid #33414f; cursor: pointer; }
  .op-row.on { background: #1f6feb33; color: #58a6ff; }
  .op-row.off { opacity: 0.3; pointer-events: none; }
  .cov-row { display: flex; justify-content: space-between; padding: 8px; margin-bottom: 4px; background: #202b36; border: 1px solid #33414f; border-radius: 4px; }
  .cov-row.on { border-color: #3fb950; background: #3fb95022; }
  .cov-row.ban { border-color: #f85149; background: #f8514922; opacity: 0.7; }
  .red { color: #f85149; }
  .green { color: #3fb950; }
  select { margin: 2px; background: #202b36; color: #fff; border: 1px solid #33414f; }
  input { background: #202b36; color: #fff; border: 1px solid #33414f; padding: 4px; width: 100%; margin-bottom: 10px; }
</style>
</head>

  {n:"艾雅法拉",g:"Ⅳ",c:["莱塔尼亚","奥术"]},{n:"霍尔海雅",g:"Ⅳ",c:["精准","奥术"]},{n:"华法琳",g:"Ⅳ",c:["灵巧","聚合"]},
  {n:"寒檀",g:"Ⅳ",c:["远见"]},{n:"山",g:"Ⅳ",c:["投资人"]},{n:"赫德雷",g:"Ⅳ",c:["突袭"]},
  {n:"夜莺",g:"Ⅳ",c:["协防干员","聚合"]},{n:"W",g:"Ⅳ",c:["迅捷"]},{n:"淬羽赫默",g:"Ⅳ",c:["助力"]},

  {n:"黍",g:"Ⅴ",c:["炎","远见"]},{n:"老鲤",g:"Ⅴ",c:["炎","投资人"]},{n:"佩佩",g:"Ⅴ",c:["萨尔贡","灵巧"]},
  {n:"鸿雪",g:"Ⅴ",c:["萨尔贡","精准"]},{n:"维娜·维多利亚",g:"Ⅴ",c:["维多利亚","奇迹"]},{n:"圣聆初雪",g:"Ⅴ",c:["谢拉格","奥术"]},
  {n:"凛御银灰",g:"Ⅴ",c:["谢拉格","灵巧","投资人"]},{n:"歌蕾蒂娅",g:"Ⅴ",c:["阿戈尔"]},{n:"乌尔比安",g:"Ⅴ",c:["阿戈尔"]},
  {n:"铃兰",g:"Ⅴ",c:["叙拉古"]},{n:"贝洛内",g:"Ⅴ",c:["叙拉古","突袭"]},{n:"薇薇安娜",g:"Ⅴ",c:["卡西米尔","莱塔尼亚","奥术"]},
  {n:"焰尾",g:"Ⅴ",c:["卡西米尔","迅捷"]},{n:"怒潮凛冬",g:"Ⅴ",c:["乌萨斯","奇迹"]},{n:"冻河",g:"Ⅴ",c:["乌萨斯","迅捷"]},

  {n:"迷迭香",g:"Ⅴ",c:["精准","助力"]},{n:"隐德来希",g:"Ⅴ",c:["灵巧","不屈"]},{n:"塞雷娅",g:"Ⅴ",c:["坚守","协防干员"]},

  {n:"溯光星源",g:"Ⅴ",c:["奥术"]},{n:"暴躁铁皮",g:"Ⅴ",c:["协防干员"],special:"6格"},

  {n:"烛煌",g:"Ⅵ",c:["炎","维多利亚","迅捷"]},{n:"夕",g:"Ⅵ",c:["炎","奥术"]},{n:"真言",g:"Ⅵ",c:["萨尔贡"]},

  {n:"克莱门莎",g:"Ⅵ",c:["阿戈尔"]},{n:"荒芜拉普兰德",g:"Ⅵ",c:["叙拉古"]},{n:"耀骑士临光",g:"Ⅵ",c:["卡西米尔","突袭"]},
  {n:"塔露拉",g:"Ⅵ",c:["乌萨斯","协防干员","奥术"]},{n:"引星棘刺",g:"Ⅵ",c:["伊比利亚","迅捷"]},{n:"逻各斯",g:"Ⅵ",c:["远见","奥术"]},
  {n:"蕾缪安",g:"Ⅵ",c:["精准"]},{n:"妮芙",g:"Ⅵ",c:["迅捷","远见"]},{n:"帕拉斯",g:"Ⅵ",c:["灵巧","助力"]},
  {n:"机械师",g:"Ⅵ",c:["坚守","协防干员"]},{n:"缪尔赛思",g:"Ⅵ",c:["协防干员"]},{n:"遥",g:"Ⅵ",c:["奇迹","聚合"]},

// 状态
let bans = new Set();
let sels = new Set();
let eqs = {}; // "Ⅰ|拜松": ["（无）","（无）"]

// 核心逻辑
function isBanned(op) {
  const cores = op.c.filter(x => CORES.has(x));
  if (cores.length > 0) return bans.has(cores[0]);
  return op.c.every(x => bans.has(x));
}

function getEquipCovs(opKey) {
  const eqArr = eqs[opKey] || [];
  let hasMimic = false;
  let others = [];
  eqArr.forEach(eq => {
    if (eq === "（无）" || !eq) return;
    if (eq === "变形同构体") hasMimic = true;
    else if (EQ_MAP[eq]) others.push(EQ_MAP[eq]);
  });
  return hasMimic ? others : [];
}

// 渲染函数
function renderBan() {
  const el = document.getElementById("banArea");
  el.innerHTML = "";
  COVS.forEach(c => {
    const d = document.createElement("div");
    d.className = "tag " + (bans.has(c.n) ? "red" : "");
    d.textContent = c.n;
    d.onclick = () => {
      if(bans.has(c.n)) bans.delete(c.n); else bans.add(c.n);
      renderAll();
    };
    el.appendChild(d);
  });
}

function renderOps() {
  const el = document.getElementById("opArea");
  el.innerHTML = "";
  const kw = document.getElementById("search").value.trim().toLowerCase();
  
  OPS.forEach(op => {
    if (kw && !op.n.toLowerCase().includes(kw) && !op.c.some(x=>x.includes(kw))) return;
    
    const key = op.g + "|" + op.n;
    const ban = isBanned(op);
    const d = document.createElement("div");
    d.className = "op-row " + (sels.has(key) ? "on " : "") + (ban ? "off" : "");
    d.innerHTML = `<span>[${op.g}] ${op.n}</span><span>${op.c.join(" / ")}</span>`;
    
    if(!ban) {
      d.onclick = () => {
        if(sels.has(key)) { sels.delete(key); delete eqs[key]; }
        else sels.add(key);
        renderAll();
      };
    }
    el.appendChild(d);
  });
}

function renderEquip() {
  const el = document.getElementById("equipArea");
  el.innerHTML = "";
  if (sels.size === 0) { el.textContent = "请先勾选干员"; return; }

  sels.forEach(k => {
    const [g, n] = k.split("|");
    const op = OPS.find(o=>o.n===n);
    const max = op.special === "6格" ? 6 : 2;
    if(!eqs[k]) eqs[k] = Array(max).fill("（无）");

    const row = document.createElement("div");
    row.innerHTML = `<b>[${g}] ${op.n}</b> `;
    
    for(let i=0; i<max; i++) {
      const sel = document.createElement("select");
      EQUIPS.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e; opt.textContent = e;
        if(eqs[k][i] === e) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.onchange = () => { eqs[k][i] = sel.value; renderAll(); };
      row.appendChild(sel);
    }
    el.appendChild(row);
  });
}

function renderResult() {
  const el = document.getElementById("resultArea");
  el.innerHTML = "";
  
  let counts = {}; let bases = {};
  COVS.forEach(c => { counts[c.n]=0; bases[c.n]=0; });

  sels.forEach(k => {
    const [g, n] = k.split("|");
    const op = OPS.find(o=>o.n===n);
    op.c.forEach(c => { counts[c]++; bases[c]++; });
    getEquipCovs(k).forEach(c => counts[c]++);
  });

  // 调和加成
  const hasHarmony = !bans.has("调和") && bases["调和"] >= 1;
  if (hasHarmony) {
    COVS.filter(c => CORES.has(c.n)).forEach(c => counts[c.n]++);
  }

  let activeCnt = 0;
  COVS.forEach(c => {
    const isBan = bans.has(c.n);
    const isActive = !isBan && counts[c.n] >= c.r;
    if (isActive) activeCnt++;

    const row = document.createElement("div");
    row.className = "cov-row " + (isBan ? "ban" : isActive ? "on" : "");
    row.innerHTML = `<span>${c.n} (${c.t})</span> <span>${counts[c.n]} / ${c.r} <b>${isBan ? "已Ban" : isActive ? "激活" : ""}</b></span>`;
    el.appendChild(row);
  });

  const sum = document.createElement("div");
  sum.innerHTML = `<br>已选干员: ${sels.size} | 已激活: <span class="green">${activeCnt}</span> | 调和加成: ${hasHarmony ? "是" : "否"}`;
  el.prepend(sum);
}

function renderAll() {
  renderBan(); renderOps(); renderEquip(); renderResult();
}

document.getElementById("search").oninput = renderOps;
renderAll();
</script>
